<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Noto+Serif+Sinhala:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/kandyan.css">
</head>
<body>

<div id="door-intro">
  <div class="door door-l" id="door-l"></div>
  <div class="door door-r" id="door-r"></div>
  <div class="door-center" id="door-center">
    <div class="door-medallion">
      <span class="si">සුබ මංගලම්</span>
      <div class="door-mono" id="door-mono"></div>
      <button class="door-btn" onclick="openDoors()">Tap to open</button>
    </div>
  </div>
</div>

<audio id="bg-music" loop preload="none"></audio>
<button class="music-btn" onclick="toggleMusic()">
  <i class="fas fa-music" id="music-icon"></i>
  <span id="music-label">Music</span>
</button>

<main id="app"></main>

<div id="lightbox" onclick="this.classList.remove('show')"><img alt=""></div>

<script src="js/demos.js"></script>
<script src="js/kandyan.js"></script>
</body>
</html>
