<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Noto+Serif+Sinhala:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/ariya.css">
</head>
<body>

<div class="silk" id="silk"></div>
<div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

<div id="intro">
  <div class="i-mandala-wrap"><img class="i-mandala" id="i-mandala" alt=""></div>
  <div class="i-content">
    <span class="eyebrow">The Wedding Of</span>
    <div class="orn"><i></i></div>
    <p class="i-names" id="i-names"></p>
    <p class="i-date" id="i-date"></p>
    <button class="i-btn" onclick="openIntro()"><i class="fas fa-leaf"></i> Open Invitation</button>
    <div class="i-guest" id="i-guest"></div>
  </div>
  <div class="procession i-proc"><img id="i-proc-l" alt=""><img id="i-proc-r" alt=""></div>
</div>

<audio id="bg-music" loop preload="none"></audio>
<button class="music" id="music" onclick="toggleMusic()" aria-label="Turn music on"><i class="fas fa-volume-xmark"></i></button>

<main id="app"></main>

<nav class="nav" id="nav">
  <a href="#home" class="on" aria-label="Home"><i class="fas fa-house"></i></a>
  <a href="#story" aria-label="Our story"><i class="far fa-heart"></i></a>
  <a href="#events" aria-label="Events"><i class="far fa-calendar"></i></a>
  <a href="#venue" aria-label="Venue"><i class="fas fa-location-dot"></i></a>
  <a href="#rsvp" aria-label="RSVP"><i class="far fa-envelope"></i></a>
</nav>

<div id="lightbox" onclick="this.classList.remove('show')"><img alt=""></div>

<script src="js/demos.js"></script>
<script src="js/ariya.js"></script>
</body>
</html>
