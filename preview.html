<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Preview · Bloom &amp; Vows</title>
  <link rel="icon" href="assets/images/logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/preview.css">
</head>
<body>

<div class="backdrop-tint" id="tint"></div>

<a class="ctl back" href="index.html#templates"><i class="fas fa-arrow-left"></i><span>All templates</span></a>

<div class="ctl switch">
  <button id="prev" aria-label="Previous template"><i class="fas fa-chevron-left"></i></button>
  <div class="name"><i class="fas fa-table-cells-large"></i><span id="tpl-name"></span><span class="count" id="tpl-count"></span></div>
  <button id="next" aria-label="Next template"><i class="fas fa-chevron-right"></i></button>
</div>

<div class="stage">
  <div class="phone" id="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar" id="statusbar">
        <span>9:41</span>
        <span class="icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i></span>
      </div>
      <iframe id="frame" title="Invitation preview" allow="autoplay"></iframe>
      <div class="home-bar"></div>
    </div>
  </div>
</div>

<a class="make" id="make" href="#"><i class="fab fa-whatsapp"></i> Make it yours <span id="make-price"></span> <i class="fas fa-arrow-right"></i></a>
<a class="ctl open-full" id="open-full" href="#" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i> Open full screen</a>

<script src="js/demos.js"></script>
<script src="js/preview.js"></script>
</body>
</html>
