<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Cormorant+SC:wght@500;600&family=Great+Vibes&family=Noto+Serif+Sinhala:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/perahara.css">
</head>
<body>

<div class="silk" id="silk"></div>

<div id="intro">
  <div class="i-card">
    <img class="mandala-bg" id="i-mandala" alt="">
    <span class="i-greet" id="i-greet"></span>
    <div class="i-mono" id="i-mono"></div>
    <div class="i-date" id="i-date"></div>
    <button class="i-btn" onclick="openIntro()">Tap to open</button>
  </div>
</div>

<audio id="bg-music" loop preload="none"></audio>
<button class="music" id="music" onclick="toggleMusic()" aria-label="Play music"><i class="fas fa-music"></i></button>

<main id="app"></main>

<nav class="nav" id="nav">
  <a href="#home" class="on" aria-label="Home"><i class="fas fa-house"></i></a>
  <a href="#story" aria-label="Our story"><i class="far fa-heart"></i></a>
  <a href="#events" aria-label="Events"><i class="far fa-calendar"></i></a>
  <a href="#venue" aria-label="Venue"><i class="fas fa-location-dot"></i></a>
  <a href="#rsvp" aria-label="RSVP"><i class="far fa-envelope"></i></a>
</nav>

<div id="lightbox" onclick="this.classList.remove('show')"><img alt=""></div>

<script src="js/demos.js"></script>
<script src="js/perahara.js"></script>
</body>
</html>
